; ESP32-S3-Touch-AMOLED-1.75C 紫微斗数 AI 圆屏固件
; 基于 Waveshare 官方示例（GFX_Library_for_Arduino v1.6.4 + SensorLib v0.3.3 + lvgl v8.4.0）
;
; 目标硬件：ESP32-S3R8（8MB OPI PSRAM + 32MB Flash，466x466 AMOLED，CST9217 触摸，ES7210 双麦）

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; 板载 32MB Flash（QIO 80MHz）+ OPI PSRAM（8MB）
board_build.flash_mode = qio
board_build.flash_size = 32MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions_32mb.csv

; 第三方依赖库从 PlatformIO Registry 自动拉取（首次编译自动下载）
lib_deps =
  lvgl/lvgl@^8.4.0
  lewisxhe/XPowersLib@^0.2.6
  moononournation/GFX Library for Arduino@^1.6.4
  lewisxhe/SensorLib@^0.3.3

; 递归扫描库依赖（WiFi → Network 等框架库）
; Network 库已随仓库提供在 lib/Network（来自 ESP32 官方框架，registry 无此库），
; 用相对路径 -I lib/Network/src 保证任何机器上都能编译
lib_ldf_mode = deep+
build_flags =
  -DLV_LVGL_H_INCLUDE_SIMPLE
  -DLV_CONF_INCLUDE_SIMPLE
  -I include
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  -DARDUINO_LOOP_STACK_SIZE=16384
  -I lib/Network/src
